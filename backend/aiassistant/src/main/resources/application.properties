spring.application.name=aiassistant

#spring.datasource.url=jdbc:mysql://127.0.0.1:3306/ai_assistant
#spring.datasource.username=root
#spring.datasource.password=Code2028

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.distance-type=cosine
spring.ai.vectorstore.pgvector.table-name=vector_memory

#gemini.api.key=${GEMINI_API_KEY}

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-2.5-flash

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
cloudinary.folder-name=ai_assistant_uploads

spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.project-id=com.subhajit.aiassistant
spring.ai.google.genai.embedding.text.model=text-embedding-004

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
